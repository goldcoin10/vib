[project]
name = "vib-bl"
version = "0.1.0"
description = "vi-like browsing, a wrapper for suckless surf with aliases"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-2-Clause"
dependencies = [
    "yt-dlp>=2026.10.21",
]

[project.scripts]
vib = "vib.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
